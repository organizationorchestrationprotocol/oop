name: Producer tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Refuse unverified or private visibility
        env:
          OOP_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$OOP_REPOSITORY_PRIVATE" != 'false' ]; then
            echo 'OOP producer CI must not report passing checks for non-public repositories.' >&2
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify Node.js major
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) !== 24) process.exit(1)'
      - name: Validate maintainer REPORT structure
        run: node --test tools/validate-maintainer-report.test.mjs tools/maintainer-workflow.test.mjs
      - name: Validate current producer package and checkout
        run: |
          node --version
          node tools/accept-release.mjs || { status=$?; cat tools/evidence/current-tests.tap; exit "$status"; }
          node tools/accept-release.mjs --check-current
          cat tools/evidence/current-tests.tap
          git diff --exit-code
