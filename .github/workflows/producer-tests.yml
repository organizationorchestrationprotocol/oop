name: Producer tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  local-tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate maintainer REPORT structure
        run: node --test tools/validate-maintainer-report.test.mjs tools/maintainer-workflow.test.mjs
      - name: Validate reviewed historical source transition
        run: node --test tools/source-transition.test.mjs
      - name: Validate current producer package and checkout
        run: |
          node --version
          node tools/accept-release.mjs || { status=$?; cat tools/evidence/current-tests.tap; cat tools/evidence/current-migration-tests.tap; exit "$status"; }
          node tools/accept-release.mjs --check-current
          cat tools/evidence/current-tests.tap
          cat tools/evidence/current-migration-tests.tap
          git diff --exit-code
